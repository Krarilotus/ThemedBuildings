churches_group: 礼拜堂、教堂与大教堂
churches_group_descr: |-
  每位玩家的礼拜堂、教堂和大教堂都会与所属领主匹配：欧洲领主获得基督教建筑，阿拉伯领主获得清真寺。AI 领主的阵营来自游戏本身（自定义 AI 来自 aiSwapper），玩家则取决于所选领主。
enabled: 使宗教建筑外观匹配所属领主
enabled_tooltip: 关闭时，所有礼拜堂、教堂和大教堂均按游戏原文件绘制。
preview: 放置建筑时显示主题预览
preview_tooltip: 准备放置建筑时即提前显示所属领主对应的外观。
chapel: 游戏文件中的礼拜堂属于
church: 游戏文件中的教堂属于
cathedral: 游戏文件中的大教堂属于
files_tooltip: 指定游戏原文件中该建筑贴图属于哪一方；另一方的玩家将使用本模块提供的主题贴图。
european: 欧洲风格
arabian: 阿拉伯风格
misc: 其他
