churches_group: Часовня, церковь и собор
churches_group_descr: |-
  Часовня, церковь и собор каждого игрока соответствуют его лорду: европейские лорды получают христианские храмы, арабские — мечети. Сторона лордов ИИ берётся из игры (а для пользовательских ИИ — из aiSwapper), а ваша — по выбранному лорду.
enabled: Подбирать облик религиозных зданий под лорда
enabled_tooltip: Если отключено, все часовни, церкви и соборы отображаются так, как в файлах игры.
preview: Тематический предпросмотр при постройке
preview_tooltip: Выбранное для постройки здание сразу отображается в стиле вашего лорда.
chapel: Часовня в файлах игры —
church: Церковь в файлах игры —
cathedral: Собор в файлах игры —
files_tooltip: К какой стороне относится изображение этого здания в файлах игры. Игроки другой стороны получают тематическое изображение из этого модуля.
european: Европейская
arabian: Арабская
misc: Разное
