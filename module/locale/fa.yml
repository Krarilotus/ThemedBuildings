churches_group: نمازخانه، کلیسا و کلیسای جامع
churches_group_descr: |-
  نمازخانه، کلیسا و کلیسای جامع هر بازیکن با لرد او هماهنگ می‌شود: لردهای اروپایی بناهای مسیحی و لردهای عرب مسجد دریافت می‌کنند. جناح لردهای هوش مصنوعی از بازی (و برای هوش مصنوعی‌های سفارشی از aiSwapper) و جناح شما از لرد انتخابی‌تان گرفته می‌شود.
enabled: هماهنگ‌سازی بناهای مذهبی با لرد مالک
enabled_tooltip: در حالت خاموش، همهٔ نمازخانه‌ها، کلیساها و کلیساهای جامع دقیقاً مانند فایل‌های اصلی بازی نمایش داده می‌شوند.
preview: پیش‌نمایش ساخت با ظاهر متناسب
preview_tooltip: ساختمانی که قصد ساخت آن را دارید پیشاپیش با ظاهر لرد شما نمایش داده می‌شود.
qol: سهولت استفاده
