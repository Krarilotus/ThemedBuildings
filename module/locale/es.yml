churches_group: Capilla, iglesia y catedral
churches_group_descr: |-
  La capilla, iglesia y catedral de cada jugador coinciden con su señor: los señores europeos obtienen edificios cristianos y los señores árabes, mezquitas. El bando de los señores de la IA proviene del juego (y de aiSwapper para IA personalizadas); el tuyo, del señor que juegues.
enabled: Adaptar edificios religiosos al señor propietario
enabled_tooltip: Desactivado muestra cada capilla, iglesia y catedral tal como las dibujan los archivos del juego.
preview: Vista previa de colocación adaptada
preview_tooltip: El edificio que vas a colocar muestra ya el aspecto que recibe tu señor.
